[project]
name = "domoio"
version = "0.1.0"
description = "A Python module for accessing Domo resources."
readme = "README.md"
authors = [
    { name = "Bradley Morris", email = "bradleydonmorris@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.3",
    "httpx>=0.28.1",
    "pandas>=3.0.3",
    "polars>=1.41.2",
    "pyarrow>=24.0.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"
